<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust WebAssembly Speed Test 🦀⚡</title>
    <style>
        body { 
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; 
            background: #030208; 
            color: #f8fafc; 
            max-width: 600px; 
            margin: 50px auto; 
            padding: 20px; 
            border: 1px solid #1a1530;
            border-radius: 8px;
        }
        h1 {
            font-size: 24px;
            border-bottom: 1px solid #1a1530;
            padding-bottom: 10px;
            color: #06b6d4; /* Celeste / Turquesa Cyberpunk */
        }
        button { 
            background: #8b5cf6; /* Violeta neón */
            border: 1px solid #8b5cf6; 
            color: white; 
            padding: 12px 24px; 
            font-size: 14px; 
            font-family: inherit;
            cursor: pointer; 
            border-radius: 4px; 
            margin: 20px 0; 
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
        }
        button:hover { 
            background: #06b6d4; 
            border-color: #06b6d4;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }
        .result { 
            background: rgba(7, 6, 16, 0.6); 
            padding: 20px; 
            border-radius: 6px; 
            margin-top: 20px; 
            border: 1px solid #1a1530;
            border-left: 4px solid #8b5cf6; 
        }
        .highlight { 
            color: #06b6d4; 
            font-weight: bold; 
        }
        .speedup-highlight {
            color: #10b981; /* Verde brillante */
            font-weight: bold;
        }
        p {
            line-height: 1.6;
            color: #cbd5e1;
        }
        strong {
            color: #f8fafc;
        }
    </style>
</head>
<body>
    <h1>Rust WebAssembly Speed Test 🦀⚡</h1>
    <p>Calculando la cantidad de números primos hasta <strong>500.000</strong> de forma iterativa.</p>
    
    <button id="run-btn">&gt; INICIAR_PRUEBA_RENDIMIENTO</button>

    <div class="result" id="output" style="display: none;">
        <p><strong>[ DIAGNÓSTICO_SISTEMA_LOGS ]</strong></p>
        <p style="margin-top: 10px;">JavaScript Puro: <span id="js-time" class="highlight">Calculando...</span></p>
        <p>Rust (WASM): <span id="rust-time" class="highlight">Calculando...</span></p>
        <p id="comparison" style="margin-top: 15px; border-top: 1px dashed #1a1530; padding-top: 15px;"></p>
    </div>

    <script type="module">
        // Importamos el código compilado de WebAssembly
        import init, { count_primes } from './pkg/wasm_speed_boost.js';

        // Versión idéntica de la lógica de números primos escrita en JavaScript puro
        function jsIsPrime(n) {
            if (n <= 1) return false;
            if (n === 2) return true;
            if (n % 2 === 0) return false;
            let limit = Math.sqrt(n);
            for (let i = 3; i <= limit; i += 2) {
                if (n % i === 0) return false;
            }
            return true;
        }

        function jsCountPrimes(limit) {
            let count = 0;
            for (let i = 2; i < limit; i++) {
                if (jsIsPrime(i) === true) count++;
            }
            return count;
        }

        document.getElementById('run-btn').addEventListener('click', async () => {
            const limit = 500000;
            const output = document.getElementById('output');
            output.style.display = 'block';

            // 1. Inicializar el módulo de WebAssembly
            await init();

            // 2. Correr la prueba en JavaScript Puro
            const t0 = performance.now();
            const jsResult = jsCountPrimes(limit);
            const t1 = performance.now();
            const jsTime = (t1 - t0).toFixed(2);
            document.getElementById('js-time').innerText = `${jsTime} ms (Encontrados: ${jsResult})`;

            // 3. Correr la prueba en Rust via WebAssembly
            const t2 = performance.now();
            const rustResult = count_primes(limit);
            const t3 = performance.now();
            const rustTime = (t3 - t2).toFixed(2);
            document.getElementById('rust-time').innerText = `${rustTime} ms (Encontrados: ${rustResult})`;

            // 4. Mostrar la comparación
            const speedup = (jsTime / rustTime).toFixed(1);
            document.getElementById('comparison').innerHTML = `¡Rust (WASM) fue <span class="speedup-highlight">${speedup} veces</span> más rápido que JavaScript puro!`;
        });
    </script>
</body>
</html>
